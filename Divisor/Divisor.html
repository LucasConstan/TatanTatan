<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Divisor de equipos · TatanTatan</title>
  <meta name="theme-color" content="#1b5e20">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
  <link rel="stylesheet" href="../comun/base.css">
  <link rel="stylesheet" href="Divisor.css">
</head>
<body>

  <header class="barra">
    <a class="volver" href="../index.html">← Menú</a>
    <h1>Divisor de equipos</h1>
  </header>

  <main class="contenedor">

    <section class="panel opciones" aria-label="Opciones del partido">
      <div class="segmentado" role="radiogroup" aria-label="Tipo de cancha">
        <label><input type="radio" name="cancha" value="5"><span>Cancha de 5</span></label>
        <label><input type="radio" name="cancha" value="7"><span>Cancha de 7</span></label>
      </div>

      <label class="interruptor">
        <input type="checkbox" id="equilibrar">
        <span>Equilibrar por nivel</span>
      </label>
    </section>

    <section class="panel" aria-labelledby="tituloJugadores">
      <div class="panel-titulo">
        <h2 id="tituloJugadores">Jugadores</h2>
        <span id="contador" class="contador" aria-live="polite"></span>
      </div>

      <p id="ayudaNivel" class="ayuda">Nivel: 1 = flojo · 5 = crack. Solo se usa para emparejar.</p>

      <ul id="lista" class="lista-jugadores"></ul>

      <form id="formAgregar" class="fila-agregar">
        <input id="nuevoJugador" class="campo" placeholder="Agregar jugador" autocomplete="off"
               maxlength="24" enterkeyhint="done" aria-label="Nombre del jugador nuevo">
        <button type="submit" class="btn">Agregar</button>
      </form>
    </section>

    <button type="button" id="btnDividir" class="btn btn-grande">⚽ Armar equipos</button>

    <section id="resultado" class="panel resultado" hidden aria-live="polite" aria-label="Equipos">
      <div class="equipos">
        <div class="equipo equipo-a">
          <h2>Equipo 1 <span class="cantidad" id="cantidadA"></span></h2>
          <ul id="grupoA"></ul>
        </div>
        <div class="equipo equipo-b">
          <h2>Equipo 2 <span class="cantidad" id="cantidadB"></span></h2>
          <ul id="grupoB"></ul>
        </div>
      </div>

      <p id="diferencia" class="diferencia"></p>

      <div class="acciones">
        <button type="button" id="btnCompartir" class="btn btn-secundario">📤 Compartir</button>
        <button type="button" id="btnCancha" class="btn">📋 Ver en la cancha</button>
      </div>
    </section>

  </main>

  <script src="../comun/app.js"></script>
  <script src="Divisor.js"></script>
</body>
</html>
